name: 월요일 공고 점검

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 게시판 점검
        run: python scraper/check.py | tee check.log
      - name: 결과 저장
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add data/notices.json
          git diff --cached --quiet || git commit -m "공고 점검 $(date -u +%F)"
          git push
